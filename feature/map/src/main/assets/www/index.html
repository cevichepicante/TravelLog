<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cesium 지도 (모바일 WebView)</title>

  <!-- 라이브러리는 앱에 내장(오프라인) -->
  <script src="./cesium/Cesium.js"></script>
  <link href="./cesium/Widgets/widgets.css" rel="stylesheet" />

  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    /* 모바일 화면에서 안 쓸 데스크톱용 위젯 숨김 */
    .cesium-viewer-toolbar,
    .cesium-viewer-animationContainer,
    .cesium-viewer-timelineContainer,
    .cesium-viewer-bottom {
      display: none !important;
    }

    #country-popup {
      position: fixed;
      display: none;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      overflow: hidden;
      min-width: 160px;
      max-width: 220px;
      z-index: 999;
    }
    #country-popup .popup-item {
      padding: 12px 16px;
      font-size: 14px;
      color: #111;
      cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
    }
    #country-popup .popup-item:last-child {
      border-bottom: none;
    }
    #country-popup .popup-item:active {
      background: #f5f5f5;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="country-popup"></div>

  <script src="./config.js"></script>
  <script>
    Cesium.Ion.defaultAccessToken = CESIUM_TOKEN;

    async function main() {
      const viewer = new Cesium.Viewer("cesiumContainer", {
        baseLayerPicker: false,
        geocoder: false,
        homeButton: false,
        sceneModePicker: false,
        navigationHelpButton: false,
        animation: false,
        timeline: false,
        fullscreenButton: false,
        infoBox: false,
        selectionIndicator: false,
        terrain: Cesium.Terrain.fromWorldTerrain({
          requestVertexNormals: false,
          requestWaterMask: false,
        }),
        requestRenderMode: true,
        maximumRenderTimeChange: Infinity,
      });

      viewer.resolutionScale = window.devicePixelRatio;
      viewer.scene.globe.maximumScreenSpaceError = 1.5;
      viewer.scene.globe.preloadAncestors = true;
      viewer.scene.globe.tileCacheSize = 300;
      viewer.scene.postProcessStages.fxaa.enabled = true;
      viewer.scene.skyAtmosphere.show = false;
      viewer.scene.globe.showGroundAtmosphere = false;
      viewer.scene.debugShowFramesPerSecond = true;
      viewer.targetFrameRate = 45;

      // 낮/밤 영역 구분
      // viewer.scene.globe.enableLighting = true;
      // viewer.clock.currentTime = Cesium.JulianDate.fromDate(new Date());
      // const nightBrightness = viewer.scene.postProcessStages.add(
      //   Cesium.PostProcessStageLibrary.createBrightnessStage()
      // );
      // nightBrightness.uniforms.brightness = 0.8;

      viewer.scene.screenSpaceCameraController.minimumZoomDistance = 300000;   // 300km — 작은 나라 경계 확인 가능
      viewer.scene.screenSpaceCameraController.maximumZoomDistance = 30000000; // 30,000km — 지구 전체 여유있게
      viewer.scene.screenSpaceCameraController.enableTranslate = false;        // 지구 중심이 화면 중앙에서 벗어나지 않도록
      viewer.scene.screenSpaceCameraController.enableTilt = false;             // Pitch 막기
      viewer.scene.screenSpaceCameraController.enableLook = false;             // Roll 막기

      // 기본 레이어(Bing/Ion) 제거 후 Mapbox만 사용
      viewer.imageryLayers.removeAll();
      const dpr = window.devicePixelRatio >= 2 ? '@2x' : '';
      viewer.imageryLayers.addImageryProvider(
        new Cesium.UrlTemplateImageryProvider({
          url: `https://api.mapbox.com/styles/v1/${MAPBOX_STYLE_ID}/tiles/512/{z}/{x}/{y}${dpr}?access_token=${MAPBOX_TOKEN}`,
          tileWidth: 512,
          tileHeight: 512,
          minimumLevel: 0,
          maximumLevel: 22,
        })
      );

      viewer.scene.globe.tileLoadProgressEvent.addEventListener(() => {
        viewer.scene.requestRender();
      });

      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(128.0, 35.9, 15000000),
      });

      // 한반도 경계 이탈 시 복귀 로직 — 줌인 시 오작동으로 비활성화
      // viewer.camera.moveEnd.addEventListener(() => {
      //   const viewRect = viewer.camera.computeViewRectangle();
      //   if (viewRect && !Cesium.Rectangle.intersection(viewRect, KOREA_RECTANGLE)) {
      //     viewer.camera.flyTo({ destination: KOREA_RECTANGLE, duration: 1.0 });
      //   }
      // });

      // ── 로컬 국가 데이터 로드 + 점-폴리곤 검사 ──

      function notifyNative(payload) {
        try {
          if (window.NativeBridge && window.NativeBridge.postMessage) {
            window.NativeBridge.postMessage(JSON.stringify(payload));
          } else if (window.webkit?.messageHandlers?.nativeBridge) {
            window.webkit.messageHandlers.nativeBridge.postMessage(payload);
          }
        } catch (e) {
          console.warn("Native bridge not available:", e);
        }
      }

      function pointInRing(lon, lat, ring) {
        let inside = false;
        for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
          const [xi, yi] = ring[i];
          const [xj, yj] = ring[j];
          if ((yi > lat) !== (yj > lat) && lon < ((xj - xi) * (lat - yi)) / (yj - yi) + xi) {
            inside = !inside;
          }
        }
        return inside;
      }

      function pointInGeometry(lon, lat, geometry) {
        if (geometry.type === 'Polygon') {
          return pointInRing(lon, lat, geometry.coordinates[0]);
        }
        if (geometry.type === 'MultiPolygon') {
          return geometry.coordinates.some(poly => pointInRing(lon, lat, poly[0]));
        }
        return false;
      }

      function computeCentroid(geometry) {
        let sumLon = 0, sumLat = 0, count = 0;
        const process = (ring) => ring.forEach(([lon, lat]) => { sumLon += lon; sumLat += lat; count++; });
        if (geometry.type === 'Polygon') process(geometry.coordinates[0]);
        else if (geometry.type === 'MultiPolygon') geometry.coordinates.forEach(p => process(p[0]));
        return count > 0 ? [sumLon / count, sumLat / count] : null;
      }

      function findNearbyCountries(lon, lat, maxCount = 5, maxDist = 15) {
        return countriesData.features
          .map(f => {
            const c = computeCentroid(f.geometry);
            if (!c) return null;
            const dist = Math.hypot(lon - c[0], lat - c[1]);
            return { feature: f, dist };
          })
          .filter(item => item && item.dist <= maxDist)
          .sort((a, b) => a.dist - b.dist)
          .slice(0, maxCount)
          .map(item => item.feature);
      }

      const countriesRes = await fetch('./countries.geojson');
      const countriesData = await countriesRes.json();

      // ── 팝업 ──

      const popup = document.getElementById('country-popup');

      function showPopup(screenX, screenY, features) {
        popup.innerHTML = '';
        features.forEach(f => {
          const item = document.createElement('div');
          item.className = 'popup-item';
          item.textContent = f.properties.name;
          item.addEventListener('click', () => {
            hidePopup();
            selectCountryFeature(f);
          });
          popup.appendChild(item);
        });

        // 화면 밖으로 나가지 않도록 위치 조정
        popup.style.display = 'block';
        const pw = popup.offsetWidth, ph = popup.offsetHeight;
        const x = Math.min(screenX, window.innerWidth - pw - 8);
        const y = Math.min(screenY, window.innerHeight - ph - 8);
        popup.style.left = `${Math.max(8, x)}px`;
        popup.style.top  = `${Math.max(8, y)}px`;
        viewer.scene.requestRender();
      }

      function hidePopup() {
        popup.style.display = 'none';
      }

      // ── 나라 선택 공통 로직 ──

      function selectCountryFeature(feature) {
        highlightFeature(feature);
        notifyNative({ type: 'countrySelected', name: feature.properties.name, code: feature.properties.code });

        let minLon = Infinity, maxLon = -Infinity, minLat = Infinity, maxLat = -Infinity;
        const processRing = (ring) => ring.forEach(([lon, lat]) => {
          minLon = Math.min(minLon, lon); maxLon = Math.max(maxLon, lon);
          minLat = Math.min(minLat, lat); maxLat = Math.max(maxLat, lat);
        });
        if (feature.geometry.type === 'Polygon') processRing(feature.geometry.coordinates[0]);
        else if (feature.geometry.type === 'MultiPolygon') feature.geometry.coordinates.forEach(p => processRing(p[0]));

        const pad = 1.5;
        viewer.camera.flyTo({
          destination: Cesium.Rectangle.fromDegrees(minLon - pad, minLat - pad, maxLon + pad, maxLat + pad),
          duration: 1.5,
        });
        viewer.scene.requestRender();
      }

      window.selectCountryByCode = function(code) {
        const feature = countriesData.features.find(f => f.properties.code === code);
        if (feature) selectCountryFeature(feature);
      };

      let highlightEntities = [];

      function clearHighlight() {
        highlightEntities.forEach(e => viewer.entities.remove(e));
        highlightEntities = [];
      }

      function addPolygonEntity(ring) {
        const positions = ring.map(([lon, lat]) => Cesium.Cartesian3.fromDegrees(lon, lat));
        return viewer.entities.add({
          polygon: {
            hierarchy: new Cesium.PolygonHierarchy(positions),
            material: Cesium.Color.YELLOW.withAlpha(0.35),
            outline: true,
            outlineColor: Cesium.Color.YELLOW,
            outlineWidth: 2,
          }
        });
      }

      function highlightFeature(feature) {
        clearHighlight();
        const geom = feature.geometry;
        if (geom.type === 'Polygon') {
          highlightEntities.push(addPolygonEntity(geom.coordinates[0]));
        } else if (geom.type === 'MultiPolygon') {
          geom.coordinates.forEach(poly => {
            highlightEntities.push(addPolygonEntity(poly[0]));
          });
        }
        viewer.scene.requestRender();
      }

      // ── 클릭 / 롱클릭 핸들러 ──

      const eventHandler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
      let longPressTimer = null;
      let longPressPos = null;
      let justLongPressed = false;
      const LONG_PRESS_MS = 600;

      function screenToLonLat(position) {
        const cartesian = viewer.camera.pickEllipsoid(position, viewer.scene.globe.ellipsoid);
        if (!cartesian) return null;
        const carto = Cesium.Cartographic.fromCartesian(cartesian);
        return [Cesium.Math.toDegrees(carto.longitude), Cesium.Math.toDegrees(carto.latitude)];
      }

      eventHandler.setInputAction((e) => {
        longPressPos = e.position;
        longPressTimer = setTimeout(() => {
          if (!longPressPos) return;
          const ll = screenToLonLat(longPressPos);
          if (!ll) return;
          const nearby = findNearbyCountries(ll[0], ll[1]);
          if (nearby.length > 0) {
            showPopup(longPressPos.x, longPressPos.y, nearby);
            justLongPressed = true;
          }
          longPressTimer = null;
        }, LONG_PRESS_MS);
      }, Cesium.ScreenSpaceEventType.LEFT_DOWN);

      eventHandler.setInputAction(() => {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }, Cesium.ScreenSpaceEventType.LEFT_UP);

      eventHandler.setInputAction(() => {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

      eventHandler.setInputAction((click) => {
        // 롱클릭 직후 발생하는 클릭은 무시
        if (justLongPressed) { justLongPressed = false; return; }
        // 팝업 외부 클릭 시 닫기
        if (popup.style.display === 'block') { hidePopup(); return; }
        const ll = screenToLonLat(click.position);
        if (!ll) return;
        const feature = countriesData.features.find(f => pointInGeometry(ll[0], ll[1], f.geometry));
        if (feature) {
          selectCountryFeature(feature);
        } else {
          clearHighlight();
          viewer.scene.requestRender();
        }
      }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
    }

    main().catch((err) => {
      document.body.innerHTML =
        '<pre style="color:#fff;background:#000;padding:16px;">' +
        "Cesium 초기화 오류: " + (err && err.message ? err.message : err) +
        "</pre>";
      console.error(err);
    });
  </script>
</body>
</html>
